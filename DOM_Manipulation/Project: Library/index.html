<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Personal Library</h1>

    <div id="buttons-container">
        <button type="button" id="toggle-form-btn" class="toggle-form-btn">+ Add a Book</button>

        <form id="add-book-form" class="hidden">
            <div class="form-grid">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" required>
                </div>
                <div class="form-group">
                    <label for="genre">Genre</label>
                    <input type="text" id="genre" name="genre">
                </div>
                <div class="form-group">
                    <label for="pages">Pages</label>
                    <input type="number" id="pages" name="pages" min="1" required>
                </div>
                <div class="form-group full-width">
                    <label for="cover">Cover Image URL (optional)</label>
                    <input type="text" id="cover" name="cover" placeholder="e.g. images/hobbit.jpg or web image link">
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="read" name="read">
                <label for="read">Already read</label>
            </div>

            <div class="form-actions">
                <button type="button" id="cancel-btn" class="cancel-btn">Cancel</button>
                <button type="submit" class="add-book" id="add-book">Add Book</button>
            </div>
        </form>
    </div>

    <div id="search-bar" class="search-bar">
        <input type="search" id="search-input" placeholder="Search by title, author, genre or pages...">
        <select id="status-filter">
            <option value="all">All Status</option>
            <option value="read">Read</option>
            <option value="not-read">Not Read</option>
        </select>
    </div>


    <div class="book-container" id="book-container"></div>
</body>

</html>
