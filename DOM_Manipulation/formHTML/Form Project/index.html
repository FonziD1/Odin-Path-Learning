<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Project from the Odin Project</title>
</head>

<body>
    <section id="holder">

        <section id="for_image"><!-- the holder should have the backgorund image gotten by css -->
            <img class='logo' src="./src/Whole logo created.png"
                alt="The logo of the company with the name on the left, and the design of the company on the right">
        </section>

        <section id="form_holder">
            <div class="text_colder">
                <h1>This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest dreams. Sign up <em>now</em> to get started!</h1>
                <h2>You know you want to.</h2>
            </div>

            <div class="form_input">
                <h3>Let's do this!</h3>

                <div class="form_left_1">
                    <div class="names">
                        <label for="first_name">First Name</label>
                        <input type="text" name="first_name" id="first_name" required>
                    </div>

                    <div class="email">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" required>
                    </div>

                    <div class="password">
                        <label for="password">Password</label>
                        <input type="password" name="password" id="password" required>
                    </div>
                </div>

                <div class="form_right_1">
                    <div class="last_name">
                        <label for="last_name">Last Name</label>
                        <input type="text" name="last_name" id="last_name" required>
                    </div>

                    <div class="phone_number">
                        <label for="phone_number">Phone Number</label>
                        <input type="number" name="phone_number" id="phone_number" required>
                    </div>

                    <div class="confirm_password">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" name="confirm_password" id="confirm_password" required>
                    </div>
                </div>
            </div>

            <section class="submit_class">

                <div class="form_submit">
                    <button type="submit">Create Account</button>
                </div>

                <div class="account_holder">
                    <p>Already have an account? <a href="">Log in</a></p>
                </div>
            </section>

        </section>



    </section>

</body>

</html>
